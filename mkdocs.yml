site_name: LiveHD and Pyrope

repo_url: https://github.com/masc-ucsc/livehd
  # edit_url: https://github.com/masc-ucsc/docs/edit/main/docs

remote_branch: gh-pages

plugins:
  - search

theme:
  name: material
  custom_dir: overrides
  font:
    code: Fira Code
  logo: assets/pyrope5.png
  features:
    - search.suggest
    - navigation.sections
    - navigation.instant
    - navigation.indexes
      # - toc.integrate
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - toc:
      permalink: true
      toc_depth: 4
  - admonition
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: pyrope
          class: pyrope
          format: !!python/name:pyrope_highlight.fence_pyrope
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/table.css
  - stylesheets/pyrope-highlight.css

extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js
