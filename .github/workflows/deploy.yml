name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: masc-ucsc/tree-sitter-pyrope
          path: tree-sitter-pyrope

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          python-version: "3.15.2"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"

      - run: uv sync --locked

      - run: npm ci
        working-directory: tree-sitter-pyrope

      - run: make build
        env:
          PYROPE_TREE_SITTER_GRAMMAR: ${{ github.workspace }}/tree-sitter-pyrope
          PYROPE_TREE_SITTER_CLI: ${{ github.workspace }}/tree-sitter-pyrope/node_modules/tree-sitter-cli/tree-sitter

      - run: find ./site -name "*.html" -exec sed -i -E 's#<a href="https:\/\/github.com\/masc-ucsc\/livehd\/edit\/master\/(.*)"#<a href="https://github.com/masc-ucsc/docs/edit/main/\1"#g' {} +

      - run: uv run --locked ghp-import --no-jekyll --push --force --no-history --branch=gh-pages ./site
